[pytest]
addopts = -p no:cacheprovider
testpaths = tests/unit tests/integration tests/security
markers =
    integration: requires the running Compose stack
    security: TLS, authorization and secret-hygiene checks
    gpu: requires the real radiance GPU profile
    host: runs on the host with Docker access
    slow: takes more than ~30 seconds
    destructive: changes stack state; opt in with RUN_DESTRUCTIVE=1
