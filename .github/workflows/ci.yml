name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 6"

permissions:
  contents: read

env:
  # Pinned scanner versions. Checksums are verified for downloaded binaries.
  GITLEAKS_VERSION: "8.28.0"
  TRIVY_VERSION: "0.76.1"
  SYFT_VERSION: "1.55.0"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest==9.2.0 PyYAML==6.0.3
      - run: python -m pytest -q tests/unit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pip install yamllint==1.37.1
      - run: python -m compileall -q deploy scripts tests
      - name: shell syntax
        run: find scripts deploy -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: shellcheck
        run: >-
          shellcheck --severity=error
          scripts/*.sh deploy/gateway/entrypoint.sh
          deploy/ipa/bootstrap.sh deploy/radiance/entrypoint.sh
      - name: yamllint
        run: yamllint -c .yamllint compose.yaml .github/workflows/ci.yml
      - name: hadolint
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt hadolint/hadolint:v2.12.0
          hadolint --config .hadolint.yaml
          deploy/gateway/Dockerfile deploy/pi/Dockerfile
          tests/Dockerfile tests/mock/Dockerfile

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: scan
        run: ./gitleaks dir . -c .gitleaks.toml --no-banner --redact --exit-code 1

  config-security:
    name: trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        run: |
          set -euo pipefail
          curl -sSfL -o "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
      - name: config scan
        run: >-
          ./trivy config --exit-code 1 --severity HIGH,CRITICAL
          --ignorefile .trivyignore
          --skip-dirs run --skip-dirs secrets --skip-dirs work --skip-dirs .git .

  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config -q

  gateway-check:
    name: gateway module check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make gateway-check

  integration-fast:
    name: FreeIPA + gateway + mock integration
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: match the runner UID
        run: |
          uid="$(id -u)"; gid="$(id -g)"
          sed -i "s/^PI_UID=.*/PI_UID=$uid/; s/^PI_GID=.*/PI_GID=$gid/; \
                  s/^RADIANCE_UID=.*/RADIANCE_UID=$uid/; s/^RADIANCE_GID=.*/RADIANCE_GID=$gid/" .env
      - run: ./scripts/up.sh
      - run: make test-fast
      - name: logs on failure
        if: failure()
        run: docker compose --env-file .env --profile test-fast logs --tail=200
      - name: teardown
        if: always()
        run: ./scripts/down.sh

  image-scan:
    name: image CVEs + SBOM
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: build images
        run: |
          docker compose --env-file .env \
            --profile client --profile test-fast --profile test \
            build radiance-gateway pi-login mock-radiance test-runner
      - name: install trivy and syft
        run: |
          set -euo pipefail
          curl -sSfL -o "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o trivy-checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy-checksums.txt | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          curl -sSfL -o "syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o syft-checksums.txt \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          grep "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft-checksums.txt | sha256sum -c -
          tar -xzf "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft
      - name: gate CRITICAL fixable vulnerabilities
        run: |
          set -euo pipefail
          for image in \
            radiance-krb-gateway:local \
            radiance-krb-pi:local \
            radiance-krb-tests:local \
            radiance-krb-mock:local; do
            echo "== $image"
            ./trivy image --quiet --exit-code 1 --severity CRITICAL \
              --ignore-unfixed --scanners vuln "$image"
          done
      - name: report HIGH findings, SBOM, and image inventory
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports sbom
          for image in \
            radiance-krb-gateway:local \
            radiance-krb-pi:local \
            radiance-krb-tests:local \
            radiance-krb-mock:local; do
            name="${image%%:*}"
            ./trivy image --quiet --exit-code 0 --severity HIGH,CRITICAL \
              --ignore-unfixed --scanners vuln \
              --format json --output "reports/${name}.json" "$image"
            ./syft "$image" -o "spdx-json=sbom/${name}.spdx.json"
          done
          ./trivy image --quiet --format table --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed radiance-krb-pi:local \
            > reports/pi-high-table.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            reports/
            sbom/
          retention-days: 30
